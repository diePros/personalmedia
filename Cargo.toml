[package]
name = "personal-media"
version = "1.4.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
askama = "0.16.1"
axum = { version = "0.8.9", features = ["multipart"] }
bytes = "1.12.1"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
data-encoding = "2.11.1"
futures-util = "0.3.34"
hex = "0.4.3"
hkdf = "0.13.0"
http-body-util = "0.1.5"
libc = "0.2.191"
mime_guess = "2.0.5"
ort = "=2.0.0-rc.15"
rand = "0.10.4"
rpassword = "7"
rusqlite = { version = "0.43.0", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
serde_urlencoded = "0.7.1"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = "0.3.55"
tokenizers = "0.22"
tokio = { version = "1.54.1", features = ["full"] }
totp-rs = { version = "6.0.0", features = ["qr", "zeroize"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3"
uuid = { version = "1.29.2", features = ["v4"] }
zeroize = { version = "1.9.1", features = ["derive"] }
zip = "9.6.0"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
