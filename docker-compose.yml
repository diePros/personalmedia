services:
  personal-media:
    # Prebuilt image from GitHub (see docs/setup.md "Updating"). `docker compose pull`
    # fetches it; `docker compose up -d --build` builds locally from this checkout instead.
    image: ghcr.io/diepros/personalmedia:latest
    build:
      context: .
      # ort-sys downloads its runtime from cdn.pyke.io during the build; the default
      # build network can fail over IPv6, host networking avoids that.
      network: host
    container_name: personal-media
    restart: unless-stopped
    network_mode: host
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      PM_BIND: 127.0.0.1:8080
      PM_PUBLIC_URL: https://<node>.<tailnet>.ts.net   # edit: your Funnel URL
      PM_TRUSTED_PROXY: 127.0.0.1
      PM_MAX_UPLOAD_MB: "100"
      # PM_IOS_SHORTCUT_URL: https://www.icloud.com/shortcuts/<32 hex chars>   # optional: iCloud link of the PMS Shortcut
    volumes:
      - /DATA/AppData/personal-media:/data
    tmpfs:
      # OCR scratch: plaintext never touches disk
      - /data/tmp:size=512m,mode=0700,uid=10001,gid=10001
