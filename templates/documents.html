{% extends "base.html" %}
{% block title %}Documents · PMS{% endblock %}
{% block content %}
<aside id="install-hint" class="install-hint" aria-label="Install the app" hidden>
<p class="install-hint-android" hidden>Install PMS for quick scanning</p>
<p class="install-hint-ios" hidden>Install PMS: tap <strong>Share</strong> <svg class="share-glyph" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v12M8 7l4-4 4 4M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> then <strong>Add to Home Screen</strong></p>
<button type="button" id="install-hint-install" class="install-hint-android" hidden>Install</button>
<button type="button" id="install-hint-dismiss" class="install-hint-dismiss" aria-label="Dismiss install hint">&times;</button>
</aside>
<h1>Documents</h1>

<section class="upload" aria-label="Upload">
<div id="dropzone" class="dropzone">
<p>Drop files here, or choose files to upload.</p>
<label for="file-input">Files</label>
<input type="file" id="file-input" multiple>
</div>
<ul id="upload-status" class="upload-status" aria-live="polite"></ul>
</section>

<form class="search" method="get" action="/documents" role="search" hx-get="/documents" hx-target="#results" hx-push-url="false" hx-sync="this:replace">
<div>
<label for="q">Search</label>
<input type="search" id="q" name="q" value="{{ q }}" autocomplete="off" hx-get="/documents" hx-trigger="input changed delay:300ms, search" hx-target="#results" hx-push-url="false" hx-include="closest form">
</div>
<div class="filters">
<div>
<label for="tag">Tag</label>
<select id="tag" name="tag" hx-get="/documents" hx-trigger="change" hx-target="#results" hx-push-url="false" hx-include="closest form">
<option value="">Any</option>
{% for t in tags -%}
<option value="{{ t }}"{% if *t == tag %} selected{% endif %}>{{ t }}</option>
{% endfor -%}
</select>
</div>
<div>
<label for="from">From</label>
<input type="date" id="from" name="from" value="{{ from }}" hx-get="/documents" hx-trigger="change" hx-target="#results" hx-push-url="false" hx-include="closest form">
</div>
<div>
<label for="to">To</label>
<input type="date" id="to" name="to" value="{{ to }}" hx-get="/documents" hx-trigger="change" hx-target="#results" hx-push-url="false" hx-include="closest form">
</div>
</div>
<fieldset class="mode">
<legend>Search</legend>
<label><input type="radio" name="mode" value="words"{% if !meaning %} checked{% endif %} hx-get="/documents" hx-trigger="change" hx-target="#results" hx-push-url="false" hx-include="closest form"> Words</label>
<label><input type="radio" name="mode" value="meaning"{% if meaning %} checked{% endif %} hx-get="/documents" hx-trigger="change" hx-target="#results" hx-push-url="false" hx-include="closest form"> Meaning</label>
</fieldset>
<button type="submit">Search</button>
</form>

<div id="results" aria-live="polite">
{% include "_results.html" %}
</div>
{% endblock %}
