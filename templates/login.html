{% extends "base.html" %}
{% block title %}Log in · PMS{% endblock %}
{% block content %}
<section class="auth">
<h1>Log in</h1>
{% if let Some(error) = error -%}
<p class="error" role="alert">{{ error }}</p>
{% endif -%}
<form method="post" action="/login" class="stack">
<div>
<label for="username">Username</label>
<input type="text" id="username" name="username" value="{{ username }}" autocomplete="username" autocapitalize="none" spellcheck="false" required>
</div>
<div>
<label for="password">Password</label>
<input type="password" id="password" name="password" autocomplete="current-password" required>
</div>
<div>
<label for="code">Authenticator code (only if enabled)</label>
<input type="text" id="code" name="code" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9 ]*">
</div>
<button type="submit">Log in</button>
</form>
<p><a href="/recover">Lost your password? Use your recovery key</a></p>
</section>
{% endblock %}
